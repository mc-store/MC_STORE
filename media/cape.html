
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff9d16">
<title>Cape Details | MC STORE</title>

<style>
:root {
  --orange:#ff9418;
  --yellow:#ffd65a;
  --dark:#20150b;
  --text:#fff9ee;
  --muted:#c8b9a5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 15% 10%,#ffb52e55,transparent 40%),
    radial-gradient(ellipse at 90% 80%,#ff6d1650,transparent 40%),
    linear-gradient(135deg,#20150b,#3a210b 50%,#171009);
  background-attachment:fixed;
}
a{text-decoration:none;color:inherit}
nav{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;padding:14px 7%;
  background:#170f09ed;
  border-bottom:1px solid #ffc04b40;
}
.back{
  display:inline-block;padding:12px 16px;border-radius:9px;
  border:1px solid #ffce5570;background:#ffad1918;
  font-size:13px;font-weight:bold;transition:.25s;
}
.back:hover{background:#ff9c18;color:#211000;transform:translateX(-3px)}
.logo{width:140px;height:48px;object-fit:contain}
.container{max-width:1050px;margin:auto;padding:55px 22px 75px}
.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:25px}
.details{
  display:grid;grid-template-columns:1fr 1fr;gap:38px;
  align-items:center;
  padding:25px;border:1px solid #ffc75b40;border-radius:22px;
  background:linear-gradient(145deg,#34210ff2,#17110bf5);
  box-shadow:0 20px 60px #0004;
}
.art{
  min-height:370px;display:flex;align-items:center;justify-content:center;
  border-radius:16px;overflow:hidden;
  background:
    radial-gradient(ellipse at center,#ffb52e30,transparent 65%),
    #24170d;
}
.art img{
  width:75%;height:330px;object-fit:contain;
  filter:drop-shadow(0 15px 25px #0009);
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-10px) rotate(2deg)}
}
.kicker{color:#ffd15c;font-size:11px;font-weight:900;letter-spacing:2px}
h1{font-size:clamp(30px,5vw,47px);margin:15px 0}
.description{color:var(--muted);font-size:14px;line-height:1.9;margin:18px 0}
.stock{
  display:inline-block;padding:8px 12px;border-radius:7px;
  background:#173522;color:#91ffb0;font-size:11px;font-weight:bold;
}
.stock.out{background:#3c2020;color:#ffaaaa}
.price{font-size:32px;color:#ffda70;font-weight:900;margin:23px 0 8px}
.note{font-size:12px;color:var(--muted);line-height:1.8}
.buy{
  display:inline-flex;margin-top:25px;padding:15px 21px;
  align-items:center;justify-content:center;border-radius:9px;
  background:linear-gradient(110deg,#ff8218,#e5b32c);
  color:white;font-size:13px;font-weight:900;transition:.25s;
}
.buy:hover{transform:translateY(-3px);box-shadow:0 8px 25px #ff9c1845}
.buy.disabled{opacity:.5;pointer-events:none}
footer{
  border-top:1px solid #ffc75b30;padding:25px 7%;
  color:var(--muted);font-size:11px;text-align:center;
}
@media(max-width:700px){
  nav{padding:12px 4%}
  .logo{width:95px}
  .details{grid-template-columns:1fr;padding:15px;gap:25px}
  .art{min-height:280px}
  .art img{height:260px}
  .container{padding:35px 15px 50px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<nav>
  <a class="back" href="index.html">← Back to Home</a>
  <a href="index.html">
    <img class="logo" src="media/1792194385872.png" alt="MC STORE">
  </a>
</nav>

<main class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a> / <span id="crumb">Cape Details</span>
  </div>

  <div class="details">
    <div class="art">
      <img id="capeImage" src="media/320%20(1).png" alt="Minecraft Cape">
    </div>

    <div class="information">
      <div class="kicker">MC STORE · CAPE COLLECTION</div>
      <h1 id="capeName">Loading Cape...</h1>
      <span class="stock" id="capeStock">Checking stock...</span>
      <p class="description" id="capeDescription"></p>
      <div class="price" id="capePrice"></div>
      <p class="note" id="capeNote"></p>
      <a class="buy" id="buyButton"
         href="https://discord.com/invite/F38vcYVHA"
         target="_blank" rel="noopener">ORDER VIA DISCORD ↗</a>
    </div>
  </div>
</main>

<footer>
  © <span id="year"></span> MC STORE. Independent community shop.
  Not affiliated with Mojang or Microsoft.
</footer>

<script>
const capes = {
  "corrupted": {
    name:"Corrupted Cape",
    price:"$10",
    stock:true,
    image:"media/cloakFront%20(2).webp",
    description:"A distinctive cape for your Minecraft collection. Contact our team on Discord for order assistance."
  },
  "aurora": {
    name:"Aurora Cape",
    price:"$7",
    stock:true,
    image:"media/aurora-front.png",
    description:"A vibrant cape for players who want to stand out. Contact our team on Discord for order assistance."
  },
  "builder": {
    name:"Builder Cape",
    price:"$9",
    stock:true,
    image:"media/320%20(1).png",
    description:"A classic addition for Minecraft cape collectors. Contact our team on Discord for order assistance."
  },
  "experience": {
    name:"Experience Cape",
    price:"Not in stock",
    stock:false,
    image:"media/320%20(2).png",
    description:"A special cape for your Minecraft collection. Check Discord for future availability."
  },
  "crafter": {
    name:"Crafter Cape",
    price:"Not in stock",
    stock:false,
    image:"media/320%20(3).png",
    description:"A distinctive cape for Minecraft fans and collectors. Check Discord for future availability."
  },
  "menace": {
    name:"Menace Cape",
    price:"Not in stock",
    stock:false,
    image:"media/320%20(5).png",
    description:"A striking cape for your Minecraft collection. Check Discord for future availability."
  },
  "copper": {
    name:"Copper Cape",
    price:"Not in stock",
    stock:false,
    image:"media/320%20(6).png",
    description:"A copper-themed cape for Minecraft players. Check Discord for future availability."
  },
  "moonlight": {
    name:"Moonlight Cape",
    price:"Not in stock",
    stock:false,
    image:"media/cloakFront%20(4).webp",
    description:"A moonlight-inspired cape for your collection. Check Discord for future availability."
  },
  "purple-heart": {
    name:"Purple Heart Cape",
    price:"Not in stock",
    stock:false,
    image:"media/320%20(7).png",
    description:"A purple-themed cape for your Minecraft collection. Check Discord for future availability."
  }
};

const id = new URLSearchParams(window.location.search).get("cape");
const cape = capes[id];

document.getElementById("year").textContent = new Date().getFullYear();

if (cape) {
  document.title = cape.name + " | MC STORE";
  document.getElementById("capeName").textContent = cape.name;
  document.getElementById("crumb").textContent = cape.name;
  document.getElementById("capeImage").src = cape.image;
  document.getElementById("capeImage").alt = cape.name;
  document.getElementById("capeDescription").textContent = cape.description;
  document.getElementById("capePrice").textContent = cape.price;

  const stock = document.getElementById("capeStock");
  const button = document.getElementById("buyButton");

  if (cape.stock) {
    stock.textContent = "✓ IN STOCK";
    document.getElementById("capeNote").textContent =
      "Available now. Contact us on Discord to ask about ordering.";
  } else {
    stock.textContent = "NOT IN STOCK";
    stock.classList.add("out");
    document.getElementById("capeNote").textContent =
      "This cape is currently unavailable. Join Discord to ask about restocks.";
    button.textContent = "ASK ABOUT RESTOCK ↗";
  }
} else {
  document.getElementById("capeName").textContent = "Cape Not Found";
  document.getElementById("capeDescription").textContent =
    "This cape link is invalid. Return home and choose a cape from the collection.";
  document.getElementById("capePrice").textContent = "";
  document.getElementById("capeStock").textContent = "INVALID LINK";
  document.getElementById("capeStock").classList.add("out");
  document.getElementById("capeImage").style.display = "none";
  document.getElementById("buyButton").style.display = "none";
  document.getElementById("capeNote").textContent = "";
}
</script>
</body>
</html>
